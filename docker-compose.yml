services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: aquasense-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aquasense}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aquasense}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
